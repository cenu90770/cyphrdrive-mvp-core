name: CyphrDrive (MVP) CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # 1. CODE INTEGRITY & TYPE CHECK
  # -------------------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

  # -------------------------------------------------------------
  # 2. KUBERNETES MANIFEST VALIDATION (OFFLINE)
  # -------------------------------------------------------------
  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests Syntax (Offline)
        run: |
          python3 -c "
          import yaml, glob, sys
          files = sorted(glob.glob('k8s/*.yaml'))
          if not files:
              print('⚠️ No manifest files found in k8s/ directory!')
              sys.exit(1)
          for file in files:
              print(f'Checking {file}...')
              with open(file, 'r') as f:
                  list(yaml.safe_load_all(f))
          print('✅ All Kubernetes manifests parsed successfully with valid YAML syntax.')
          "

  # -------------------------------------------------------------
  # 3. CONTAINER BUILD & REGISTRY PUSH
  # -------------------------------------------------------------
  build-and-push:
    needs: [lint-and-test, validate-k8s]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
