name: CyphrDrive (MVP) Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  # 1. CODE INTEGRITY & TYPE CHECK
  # -------------------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

  # -------------------------------------------------------------
  # 2. KUBERNETES MANIFEST VALIDATION (CLIENT-SIDE)
  # -------------------------------------------------------------
  validate-k8s:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: Validate Kubernetes Manifests Syntax
        run: |
          echo "Validating Kubernetes manifests..."
          kubectl apply --dry-run=client -f k8s/00-namespace.yaml
          kubectl apply --dry-run=client -f k8s/01-configmap.yaml
          kubectl apply --dry-run=client -f k8s/03-deployment.yaml
          kubectl apply --dry-run=client -f k8s/04-service.yaml
          kubectl apply --dry-run=client -f k8s/05-hpa.yaml
          kubectl apply --dry-run=client -f k8s/06-ingress.yaml
          echo "✅ All Kubernetes manifests are syntactically valid."

  # -------------------------------------------------------------
  # 3. CONTAINER BUILD & REGISTRY PUSH
  # -------------------------------------------------------------
  build-and-push:
    needs: [lint-and-test, validate-k8s]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uses the built-in github.token (no manual secrets needed)
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
