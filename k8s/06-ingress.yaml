apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cyphrdrive-mvp-ingress
  namespace: cyphrdrive-mvp-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-protocols: "TLSv1.3"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  tls:
    - hosts:
        - api.cyphrdrive-mvp.io
      secretName: cyphrdrive-mvp-tls-cert
  rules:
    - host: api.cyphrdrive-mvp.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cyphrdrive-mvp-api-service
                port:
                  number: 80
