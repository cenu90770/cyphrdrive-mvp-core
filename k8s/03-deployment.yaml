apiVersion: apps/v1
kind: Deployment
metadata:
  name: cyphrdrive-mvp-api
  namespace: cyphrdrive-mvp-prod
  labels:
    app: cyphrdrive-mvp-api
spec:
  replicas: 3 # Default 3 pods across availability zones
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # Zero downtime deployments
  selector:
    matchLabels:
      app: cyphrdrive-mvp-api
  template:
    metadata:
      labels:
        app: cyphrdrive-mvp-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: api
          image: ghcr.io/your-org/cyphrdrive-mvp-core:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: cyphrdrive-mvp-config
            - secretRef:
                name: cyphrdrive-mvp-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
