apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cyphrdrive-api-hpa
  namespace: cyphrdrive-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cyphrdrive-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80